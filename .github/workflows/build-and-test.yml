name: "Build & Test"

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: "Tests & Coverage"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Tests & coverage
      run: |
        uv run --python ${{ matrix.python-version }} \
          pytest --cov-config=pyproject.toml --cov=mesoscopy --cov=tests \
          --cov-report=term --cov-report=lcov:lcov.info --cov-report=xml:coverage.xml

  build:
    name: "Build"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v3

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Build package
      run: |
        uv build --python ${{ matrix.python-version }}