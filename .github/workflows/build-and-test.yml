name: "Build & Test"

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: "Tests & Coverage"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Tests & coverage
      run: uv run --python ${{ matrix.python-version }} hatch run test-run-coverage

  build:
    name: "Build"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v3

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Build package with hatch
      run: |
        uv build --python ${{ matrix.python-version }}