[metadata]
name = mesoscopy
version = 0.0.3

[options]
install_requires =
    Click
    dask
    dask-image
    numpy
    h5py
    matplotlib
    tables
    importlib; python_version == "3.8"
package_dir=
    =src
packages=find:

[options.packages.find]
where=src

[options.entry_points]
console_scripts =
        mesoscopy = mesoscopy:cli